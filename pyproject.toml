[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "addisai"
version = "0.1.1"
description = "Official Addis AI SDK for Python — voice (TTS), chat/LLM with system prompts, personas and function calling, speech-to-text, and translation for Amharic and Afan Oromo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Addis AI" }]
keywords = ["addis", "addisai", "amharic", "afan-oromo", "tts", "text-to-speech", "voice", "llm", "speech-to-text", "translation", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.6"]

[project.urls]
Homepage = "https://addisassistant.com"
Repository = "https://github.com/Addis-AI-Org/addisai-py"
Issues = "https://github.com/Addis-AI-Org/addisai-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["addisai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
